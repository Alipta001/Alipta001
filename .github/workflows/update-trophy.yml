name: Update GitHub Trophy

on:
  schedule:
    # Runs automatically every day at 12:00 AM UTC
    - cron: "0 0 * * *"

  # Allows you to run it manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Generate your GitHub Trophy SVG
      - name: Generate trophy SVG
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=Alipta001&theme=tokyonight&column=7&margin-w=10&margin-h=10&no-frame=true"
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Commit the generated SVG to your repository
      - name: Commit and push trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/trophy.svg

          git commit -m "chore: update GitHub trophies" || exit 0

          git push